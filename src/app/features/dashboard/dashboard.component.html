<div class="dashboard">
  @if (isLoading()) {
    <div class="status status--loading">
      <div class="spinner" aria-hidden="true"></div>
      <p>Loading clustering results…</p>
    </div>
  } @else if (isError()) {
    <div class="status status--error">
      <p class="status__title">Could not load segmentation data</p>
      <p class="status__detail">{{ errorMessage() }}</p>
      <button type="button" class="status__btn" (click)="load()">Retry</button>
    </div>
  } @else if (isReady()) {
    <!-- Zone 1: KPIs -->
    <app-kpi-row class="dashboard__row" [clusters]="clusters()" />

    <!-- Zone 2: Cluster distribution -->
    <app-cluster-distribution class="dashboard__row" [clusters]="clusters()" />

    <!-- Zone 3: Cluster centroids -->
    <div class="dashboard__grid">
      <app-consumption-patterns-chart [clusters]="clusters()" />
    </div>

    <!-- Zone 4: Distribution + anomalies -->
    <div class="dashboard__grid dashboard__grid--split">
      <app-cluster-donut-chart [clusters]="clusters()" />
      <app-anomaly-detection />
    </div>
  }
</div>
