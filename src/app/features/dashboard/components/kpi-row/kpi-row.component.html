<div class="kpi-band">
  <div class="kpi-glass">
    @for (kpi of bandKpis(); track kpi.label) {
      <div class="stat">
        <div class="stat__label">{{ kpi.label }}</div>
        <div class="stat__valwrap">
          <span class="stat__value">{{ kpi.value }}</span>
          @if (kpi.sublabel) {
            <span class="stat__unit">{{ kpi.sublabel }}</span>
          }
        </div>
      </div>
    }
  </div>

  <div class="kpi-hero">
    <div class="kpi-hero__label">{{ heroKpi().label }}</div>
    <div class="kpi-hero__value">{{ heroKpi().value }}</div>
    <div class="kpi-hero__sub">{{ heroKpi().sublabel }}</div>
  </div>
</div>
