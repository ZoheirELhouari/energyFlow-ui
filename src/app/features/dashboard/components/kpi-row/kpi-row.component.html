<div class="kpi-row">
  @for (kpi of kpis(); track kpi.label) {
    <div class="kpi" [style.--accent]="'var(' + kpi.accentVar + ')'">
      <div class="kpi__head">
        <span class="kpi__label">{{ kpi.label }}</span>
        <span class="kpi__trend" aria-hidden="true">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <polyline points="6 15 12 9 18 15" />
          </svg>
        </span>
      </div>

      <div class="kpi__value">{{ kpi.value }}</div>
      <div class="kpi__sub">{{ kpi.sublabel }}</div>
    </div>
  }
</div>
